services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enclave
      POSTGRES_USER: enclave
      POSTGRES_PASSWORD: enclave_dev
    ports:
      - "5432:5432"
    volumes:
      - enclave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enclave -d enclave"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://enclave:enclave_dev@db:5432/enclave
      DATABASE_SSL: disable
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://enclave:enclave_dev@db:5432/enclave
      DATABASE_SSL: disable
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "ingest:treasury"]
    environment:
      DATABASE_URL: postgresql://enclave:enclave_dev@db:5432/enclave
      DATABASE_SSL: disable
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  enclave_pgdata:
